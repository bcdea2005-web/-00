name: توحيد مستند إعدادات الموقع

# يحل مشكلة «الخلفية لا تتغير من لوحة التحكم / صورة عالقة لا تختفي»:
# كان هناك مستندَي siteSettings والموقع يقرأ الأقدم منهما بينما تعدّل اللوحة الآخر.
# يُدمج الحقول في المستند المفرد siteSettings ثم يحذف المكرر.
# يُشغَّل يدوياً فقط من تبويب Actions → «توحيد مستند إعدادات الموقع» → Run workflow.
# يحتاج Secret باسم SANITY_TOKEN (رمز بصلاحية Editor من sanity.io/manage → API → Tokens).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب yes للتنفيذ الفعلي (أي قيمة أخرى = معاينة فقط)'
        required: true
        default: 'preview'

permissions:
  contents: read

jobs:
  fix-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: التحقق من وجود الرمز
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          if [ -z "$SANITY_TOKEN" ]; then
            echo "::error::لم يُضبط SANITY_TOKEN. أضفه من Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: معاينة / تنفيذ التوحيد
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          ARGS=""
          if [ "$CONFIRM" = "yes" ]; then ARGS="--yes"; fi
          echo "تشغيل: node sanity-seed/fix-settings.mjs $ARGS"
          node sanity-seed/fix-settings.mjs $ARGS
